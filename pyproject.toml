[project]
name = "hivemind"
version = "0.1.0"
description = "Neural bughouse engine, inference tools, and self-play training"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chess>=1.11.2",
    "cloudscraper>=1.2.71",
    "einops>=0.8.1",
    "matplotlib>=3.10.8",
    "onnx>=1.20.1",
    "onnxruntime>=1.23.2",
    "onnxscript>=0.5.7",
    "pandas>=2.3.3",
    "polars>=1.37.1",
    "pytest>=9.0.2",
    "rtpt>=0.0.4",
    "tensorboard>=2.20.0",
    "timm>=1.0.24",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
]

[project.optional-dependencies]
onnx-export = ["onnxsim>=0.4.36"]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu130"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["hivemind*"]

[project.scripts]
hivemind = "hivemind.cli:main"
