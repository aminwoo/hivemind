[project]
name = "hivemind"
version = "0.1.0"
description = "Neural bughouse engine, inference tools, and self-play training"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chess>=1.11.2",
    "huggingface-hub>=0.36.0",
    "onnx>=1.20.1",
    "onnxruntime>=1.23.2",
    "onnxscript>=0.5.7",
    "onnxsim==0.7.3",
    "pytest>=9.0.2",
    "torch>=2.9.1",
]

[project.optional-dependencies]
onnx-export = ["onnxsim>=0.4.36"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# CUDA wheels on Linux and Windows; macOS has none, so it uses PyPI's build.
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform != 'darwin'" }]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["hivemind*"]

[project.scripts]
hivemind = "hivemind.cli:main"
