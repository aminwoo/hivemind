name: Release bundles

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (for example, v2.2.1)
        required: true
        default: v2.2.1
      model_url:
        description: Direct ONNX URL or a Hivemind release zip containing the model
        required: true
        default: https://github.com/aminwoo/hivemind/releases/download/v2.2.0/hivemind-v2.2.0-linux-x86_64.zip
      publish:
        description: Publish the built assets to the requested release tag
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  TENSORRT_VERSION: 11.1.0.106
  CUDA_RUNTIME_VERSION: 13.3.29
  CUDA_CRT_VERSION: 13.3.33

jobs:
  prepare-model:
    runs-on: ubuntu-latest
    env:
      MODEL_URL: ${{ inputs.model_url || 'https://github.com/aminwoo/hivemind/releases/download/v2.2.0/hivemind-v2.2.0-linux-x86_64.zip' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download released network
        shell: bash
        run: |
          curl --fail --location --retry 3 "$MODEL_URL" --output "$RUNNER_TEMP/model-source"
          python - <<'PY'
          import os
          import shutil
          import zipfile
          from pathlib import Path

          source = Path(os.environ["RUNNER_TEMP"]) / "model-source"
          target = Path(os.environ["RUNNER_TEMP"]) / "hivemind.onnx"
          if zipfile.is_zipfile(source):
              with zipfile.ZipFile(source) as archive:
                  matches = [name for name in archive.namelist()
                             if name.endswith("/models/hivemind.onnx")]
                  if len(matches) != 1:
                      raise SystemExit(f"Expected one bundled model, found: {matches}")
                  with archive.open(matches[0]) as model, target.open("wb") as output:
                      shutil.copyfileobj(model, output)
          else:
              shutil.copy2(source, target)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: portable-model
          path: ${{ runner.temp }}/hivemind.onnx
          retention-days: 1

  build-portable:
    needs: prepare-model
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            slug: linux-x86_64
          - os: windows-latest
            slug: windows-x86_64
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: portable-model
          path: model
      - name: Fetch ONNX Runtime
        run: python tools/fetch_onnxruntime.py
      - name: Build and package
        shell: bash
        run: |
          python engine/scripts/package_portable_release.py \
            --model model/hivemind.onnx \
            --name "hivemind-${RELEASE_VERSION}-${{ matrix.slug }}-onnxruntime"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.slug }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  build-tensorrt-linux:
    needs: prepare-model
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: portable-model
          path: model
      - name: Fetch TensorRT and CUDA Runtime
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/nvidia/tensorrt" "$RUNNER_TEMP/nvidia/cuda"
          curl --fail --location --retry 3 \
            "https://developer.nvidia.com/downloads/compute/machine-learning/tensorrt/11.1.0/tars/TensorRT-Enterprise-${TENSORRT_VERSION}-Linux-x86_64-cuda-13.3-Release-external.tar.zst" \
            --output "$RUNNER_TEMP/tensorrt.tar.zst"
          tar --zstd -xf "$RUNNER_TEMP/tensorrt.tar.zst" \
            -C "$RUNNER_TEMP/nvidia/tensorrt" --strip-components=1
          curl --fail --location --retry 3 \
            "https://developer.download.nvidia.com/compute/cuda/redist/cuda_cudart/linux-x86_64/cuda_cudart-linux-x86_64-${CUDA_RUNTIME_VERSION}-archive.tar.xz" \
            --output "$RUNNER_TEMP/cuda-cudart.tar.xz"
          tar -xJf "$RUNNER_TEMP/cuda-cudart.tar.xz" \
            -C "$RUNNER_TEMP/nvidia/cuda" --strip-components=1
          curl --fail --location --retry 3 \
            "https://developer.download.nvidia.com/compute/cuda/redist/cuda_crt/linux-x86_64/cuda_crt-linux-x86_64-${CUDA_CRT_VERSION}-archive.tar.xz" \
            --output "$RUNNER_TEMP/cuda-crt.tar.xz"
          tar -xJf "$RUNNER_TEMP/cuda-crt.tar.xz" \
            -C "$RUNNER_TEMP/nvidia/cuda" --strip-components=1
          rm "$RUNNER_TEMP/tensorrt.tar.zst" \
            "$RUNNER_TEMP/cuda-cudart.tar.xz" "$RUNNER_TEMP/cuda-crt.tar.xz"
      - name: Build and package TensorRT
        shell: bash
        run: |
          engine/scripts/package_ubuntu_release.sh \
            --model model/hivemind.onnx \
            --tensorrt-dir "$RUNNER_TEMP/nvidia/tensorrt" \
            --cuda-dir "$RUNNER_TEMP/nvidia/cuda" \
            --name "hivemind-${RELEASE_VERSION}-linux-x86_64-tensorrt"
          LD_LIBRARY_PATH="$RUNNER_TEMP/nvidia/tensorrt/lib:$RUNNER_TEMP/nvidia/cuda/lib" \
            engine/build-ubuntu-release/hivemind.bin --help
          unzip -t "dist/hivemind-${RELEASE_VERSION}-linux-x86_64-tensorrt.zip"
          (cd dist && sha256sum -c "hivemind-${RELEASE_VERSION}-linux-x86_64-tensorrt.zip.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64-tensorrt
          path: |
            dist/*.zip
            dist/*.sha256
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  build-tensorrt-windows:
    needs: prepare-model
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: portable-model
          path: model
      - name: Fetch TensorRT and CUDA Runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $nvidia = Join-Path $env:RUNNER_TEMP "nvidia"
          $tensorrt = Join-Path $nvidia "tensorrt"
          $cuda = Join-Path $nvidia "cuda"
          New-Item -ItemType Directory -Force $tensorrt, $cuda | Out-Null
          $trtArchive = Join-Path $env:RUNNER_TEMP "tensorrt.zip"
          $cudaArchive = Join-Path $env:RUNNER_TEMP "cuda-cudart.zip"
          $crtArchive = Join-Path $env:RUNNER_TEMP "cuda-crt.zip"
          curl.exe --fail --location --retry 3 `
            "https://developer.nvidia.com/downloads/compute/machine-learning/tensorrt/11.1.0/zip/TensorRT-Enterprise-$env:TENSORRT_VERSION-Windows-amd64-cuda-13.3-Release-external.zip" `
            --output $trtArchive
          tar -xf $trtArchive -C $tensorrt --strip-components 1
          curl.exe --fail --location --retry 3 `
            "https://developer.download.nvidia.com/compute/cuda/redist/cuda_cudart/windows-x86_64/cuda_cudart-windows-x86_64-$env:CUDA_RUNTIME_VERSION-archive.zip" `
            --output $cudaArchive
          tar -xf $cudaArchive -C $cuda --strip-components 1
          curl.exe --fail --location --retry 3 `
            "https://developer.download.nvidia.com/compute/cuda/redist/cuda_crt/windows-x86_64/cuda_crt-windows-x86_64-$env:CUDA_CRT_VERSION-archive.zip" `
            --output $crtArchive
          tar -xf $crtArchive -C $cuda --strip-components 1
          Remove-Item $trtArchive, $cudaArchive, $crtArchive
      - name: Build and package TensorRT
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $tensorrt = Join-Path $env:RUNNER_TEMP "nvidia/tensorrt"
          $cuda = Join-Path $env:RUNNER_TEMP "nvidia/cuda"
          python engine/scripts/package_windows_tensorrt_release.py `
            --model model/hivemind.onnx `
            --tensorrt-root $tensorrt `
            --cuda-root $cuda `
            --name "hivemind-$env:RELEASE_VERSION-windows-x86_64-tensorrt"
          $env:PATH = "$tensorrt/bin;$cuda/bin/x64;$env:PATH"
          & engine/build-windows-tensorrt-release/Release/hivemind.exe --help
          python -m zipfile -t "dist/hivemind-$env:RELEASE_VERSION-windows-x86_64-tensorrt.zip"
          Push-Location dist
          try {
            $checksum = Get-Content "hivemind-$env:RELEASE_VERSION-windows-x86_64-tensorrt.zip.sha256"
            $expected = ($checksum -split "  ")[0]
            $actual = (Get-FileHash "hivemind-$env:RELEASE_VERSION-windows-x86_64-tensorrt.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "TensorRT archive checksum mismatch" }
          } finally {
            Pop-Location
          }
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x86_64-tensorrt
          path: |
            dist/*.zip
            dist/*.sha256
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' || inputs.publish
    needs:
      - build-portable
      - build-tensorrt-linux
      - build-tensorrt-windows
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          generate_release_notes: true
          files: release-assets/*
