name: Release bundles

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (for example, v3.0.2)
        required: true
        default: v3.0.2
      model_url:
        description: Direct ONNX URL or a Hivemind release zip containing the model
        required: true
        default: https://huggingface.co/aminwoo/bughouse-twin-s-clock/resolve/30995e780f192d56393cce94acdae234f25f6331/twin-s-clock.onnx
      model_sha256:
        description: SHA-256 of the extracted ONNX model
        required: true
        default: 40b1f9b6c6e875a068372a6510d060d14acc5c85a8c88527d39d0194e12b2ab4
      publish:
        description: Stage the built assets in a draft release for the requested tag
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  TENSORRT_VERSION: 11.1.0.106
  CUDA_RUNTIME_VERSION: 13.3.29
  CUDA_CRT_VERSION: 13.3.33
  CUDA_CCCL_VERSION: 13.3.3.3.1

jobs:
  prepare-model:
    runs-on: ubuntu-24.04
    env:
      MODEL_SHA256: ${{ inputs.model_sha256 || '40b1f9b6c6e875a068372a6510d060d14acc5c85a8c88527d39d0194e12b2ab4' }}
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
      MODEL_URL: ${{ inputs.model_url || 'https://huggingface.co/aminwoo/bughouse-twin-s-clock/resolve/30995e780f192d56393cce94acdae234f25f6331/twin-s-clock.onnx' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download released network
        shell: bash
        run: |
          curl --fail --location --retry 3 "$MODEL_URL" --output "$RUNNER_TEMP/model-source"
          python - <<'PY'
          import hashlib
          import os
          import re
          import shutil
          import zipfile
          from pathlib import Path

          version = re.search(r'project\(hivemind VERSION ([0-9.]+)', Path("engine/CMakeLists.txt").read_text())[1]
          if os.environ["RELEASE_VERSION"] != f"v{version}":
              raise SystemExit(f"Release tag must match CMake version v{version}")
          source = Path(os.environ["RUNNER_TEMP"]) / "model-source"
          target = Path(os.environ["RUNNER_TEMP"]) / "hivemind.onnx"
          if zipfile.is_zipfile(source):
              with zipfile.ZipFile(source) as archive:
                  matches = [name for name in archive.namelist()
                             if name.endswith("/models/hivemind.onnx")]
                  if len(matches) != 1:
                      raise SystemExit(f"Expected one bundled model, found: {matches}")
                  with archive.open(matches[0]) as model, target.open("wb") as output:
                      shutil.copyfileobj(model, output)
          else:
              shutil.copy2(source, target)
          with target.open("rb") as stream:
              digest = hashlib.file_digest(stream, "sha256").hexdigest()
          if digest != os.environ["MODEL_SHA256"]:
              raise SystemExit(f"Model SHA-256 mismatch: {digest}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: portable-model
          path: ${{ runner.temp }}/hivemind.onnx
          retention-days: 1

  build-portable:
    needs: prepare-model
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            slug: linux-x86_64
          - os: windows-2022
            slug: windows-x86_64
          - os: macos-14
            slug: macos-arm64
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: portable-model
          path: model
      - name: Fetch ONNX Runtime
        run: python tools/fetch_onnxruntime.py
      - name: Set macOS deployment target
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> "$GITHUB_ENV"
      - name: Install model conversion dependencies
        run: python -m pip install numpy onnx
      - name: Build and package
        shell: bash
        run: |
          python engine/scripts/package_portable_release.py \
            --model model/hivemind.onnx \
            --name "hivemind-${RELEASE_VERSION}-${{ matrix.slug }}-onnxruntime"
      - name: Smoke test the bundle on CPU
        shell: bash
        run: |
          python engine/scripts/smoke_release.py \
            "dist/hivemind-${RELEASE_VERSION}-${{ matrix.slug }}-onnxruntime.zip" \
            --backend cpu --report "dist/validation-${{ matrix.slug }}-cpu.json"
      - name: Record acceleration coverage
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "Core ML / Neural Engine inference needs a physical Apple silicon Mac; hosted VM tested on CPU only." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.slug }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/validation-*.json
          if-no-files-found: error

  build-tensorrt-linux:
    needs: prepare-model
    runs-on: ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: portable-model
          path: model
      - name: Fetch TensorRT and CUDA Runtime
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/nvidia/tensorrt" "$RUNNER_TEMP/nvidia/cuda"
          curl --fail --location --retry 3 \
            "https://developer.nvidia.com/downloads/compute/machine-learning/tensorrt/11.1.0/tars/TensorRT-Enterprise-${TENSORRT_VERSION}-Linux-x86_64-cuda-13.3-Release-external.tar.zst" \
            --output "$RUNNER_TEMP/tensorrt.tar.zst"
          tar --zstd -xf "$RUNNER_TEMP/tensorrt.tar.zst" \
            -C "$RUNNER_TEMP/nvidia/tensorrt" --strip-components=1
          curl --fail --location --retry 3 \
            "https://developer.download.nvidia.com/compute/cuda/redist/cccl/linux-x86_64/cccl-linux-x86_64-${CUDA_CCCL_VERSION}-archive.tar.xz" \
            --output "$RUNNER_TEMP/cuda-cccl.tar.xz"
          tar -xJf "$RUNNER_TEMP/cuda-cccl.tar.xz" \
            -C "$RUNNER_TEMP/nvidia/cuda" --strip-components=1
          curl --fail --location --retry 3 \
            "https://developer.download.nvidia.com/compute/cuda/redist/cuda_crt/linux-x86_64/cuda_crt-linux-x86_64-${CUDA_CRT_VERSION}-archive.tar.xz" \
            --output "$RUNNER_TEMP/cuda-crt.tar.xz"
          tar -xJf "$RUNNER_TEMP/cuda-crt.tar.xz" \
            -C "$RUNNER_TEMP/nvidia/cuda" --strip-components=1
          curl --fail --location --retry 3 \
            "https://developer.download.nvidia.com/compute/cuda/redist/cuda_cudart/linux-x86_64/cuda_cudart-linux-x86_64-${CUDA_RUNTIME_VERSION}-archive.tar.xz" \
            --output "$RUNNER_TEMP/cuda-cudart.tar.xz"
          tar -xJf "$RUNNER_TEMP/cuda-cudart.tar.xz" \
            -C "$RUNNER_TEMP/nvidia/cuda" --strip-components=1
          test -f "$RUNNER_TEMP/nvidia/cuda/include/nv/target"
          rm "$RUNNER_TEMP/tensorrt.tar.zst" "$RUNNER_TEMP/cuda-cccl.tar.xz" \
            "$RUNNER_TEMP/cuda-crt.tar.xz" "$RUNNER_TEMP/cuda-cudart.tar.xz"
      - name: Build and package TensorRT
        shell: bash
        run: |
          engine/scripts/package_ubuntu_release.sh \
            --model model/hivemind.onnx \
            --tensorrt-dir "$RUNNER_TEMP/nvidia/tensorrt" \
            --cuda-dir "$RUNNER_TEMP/nvidia/cuda" \
            --name "hivemind-${RELEASE_VERSION}-linux-x86_64-tensorrt"
          LD_LIBRARY_PATH="$RUNNER_TEMP/nvidia/tensorrt/lib:$RUNNER_TEMP/nvidia/cuda/lib" \
            engine/build-ubuntu-release/hivemind.bin --help
          unzip -t "dist/hivemind-${RELEASE_VERSION}-linux-x86_64-tensorrt.zip"
          (cd dist && sha256sum -c "hivemind-${RELEASE_VERSION}-linux-x86_64-tensorrt.zip.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64-tensorrt
          path: |
            dist/*.zip
            dist/*.sha256
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  build-tensorrt-windows:
    needs: prepare-model
    runs-on: windows-2022
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: portable-model
          path: model
      - name: Fetch TensorRT and CUDA Runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $nvidia = Join-Path $env:RUNNER_TEMP "nvidia"
          $tensorrt = Join-Path $nvidia "tensorrt"
          $cuda = Join-Path $nvidia "cuda"
          New-Item -ItemType Directory -Force $tensorrt, $cuda | Out-Null
          $trtArchive = Join-Path $env:RUNNER_TEMP "tensorrt.zip"
          $cudaArchive = Join-Path $env:RUNNER_TEMP "cuda-cudart.zip"
          $crtArchive = Join-Path $env:RUNNER_TEMP "cuda-crt.zip"
          $ccclArchive = Join-Path $env:RUNNER_TEMP "cuda-cccl.zip"
          curl.exe --fail --location --retry 3 `
            "https://developer.nvidia.com/downloads/compute/machine-learning/tensorrt/11.1.0/zip/TensorRT-Enterprise-$env:TENSORRT_VERSION-Windows-amd64-cuda-13.3-Release-external.zip" `
            --output $trtArchive
          tar -xf $trtArchive -C $tensorrt --strip-components 1
          curl.exe --fail --location --retry 3 `
            "https://developer.download.nvidia.com/compute/cuda/redist/cccl/windows-x86_64/cccl-windows-x86_64-$env:CUDA_CCCL_VERSION-archive.zip" `
            --output $ccclArchive
          tar -xf $ccclArchive -C $cuda --strip-components 1
          curl.exe --fail --location --retry 3 `
            "https://developer.download.nvidia.com/compute/cuda/redist/cuda_crt/windows-x86_64/cuda_crt-windows-x86_64-$env:CUDA_CRT_VERSION-archive.zip" `
            --output $crtArchive
          tar -xf $crtArchive -C $cuda --strip-components 1
          curl.exe --fail --location --retry 3 `
            "https://developer.download.nvidia.com/compute/cuda/redist/cuda_cudart/windows-x86_64/cuda_cudart-windows-x86_64-$env:CUDA_RUNTIME_VERSION-archive.zip" `
            --output $cudaArchive
          tar -xf $cudaArchive -C $cuda --strip-components 1
          if (-not (Test-Path (Join-Path $cuda "include/nv/target"))) {
            throw "CCCL headers are missing from the CUDA include tree"
          }
          Remove-Item $trtArchive, $cudaArchive, $crtArchive, $ccclArchive
      - name: Build and package TensorRT
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $tensorrt = Join-Path $env:RUNNER_TEMP "nvidia/tensorrt"
          $cuda = Join-Path $env:RUNNER_TEMP "nvidia/cuda"
          python engine/scripts/package_windows_tensorrt_release.py `
            --model model/hivemind.onnx `
            --tensorrt-root $tensorrt `
            --cuda-root $cuda `
            --name "hivemind-$env:RELEASE_VERSION-windows-x86_64-tensorrt"
          $env:PATH = "$tensorrt/bin;$cuda/bin/x64;$env:PATH"
          & engine/build-windows-tensorrt-release/Release/hivemind.exe --help
          python -m zipfile -t "dist/hivemind-$env:RELEASE_VERSION-windows-x86_64-tensorrt.zip"
          Push-Location dist
          try {
            $checksum = Get-Content "hivemind-$env:RELEASE_VERSION-windows-x86_64-tensorrt.zip.sha256"
            $expected = ($checksum -split "  ")[0]
            $actual = (Get-FileHash "hivemind-$env:RELEASE_VERSION-windows-x86_64-tensorrt.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "TensorRT archive checksum mismatch" }
          } finally {
            Pop-Location
          }
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x86_64-tensorrt
          path: |
            dist/*.zip
            dist/*.sha256
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' || inputs.publish
    needs:
      - build-portable
      - build-tensorrt-linux
      - build-tensorrt-windows
    runs-on: ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify complete release asset set
        shell: bash
        run: |
          for target in linux-x86_64-onnxruntime windows-x86_64-onnxruntime macos-arm64-onnxruntime linux-x86_64-tensorrt windows-x86_64-tensorrt; do
            test -f "release-assets/hivemind-${RELEASE_VERSION}-${target}.zip"
            test -f "release-assets/hivemind-${RELEASE_VERSION}-${target}.zip.sha256"
          done
          for target in linux-x86_64 windows-x86_64 macos-arm64; do
            test -f "release-assets/validation-${target}-cpu.json"
          done
          cd release-assets
          sha256sum -c ./*.sha256
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          draft: true
          body_path: docs/releases/${{ env.RELEASE_VERSION }}.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
